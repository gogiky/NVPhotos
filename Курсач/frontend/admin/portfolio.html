<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Портфолио — Админка NVPhotos</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="header-slot"></div>
<div id="layout-slot"></div>

<div class="admin-modal" id="admin-modal">
  <div class="admin-modal-content">
    <span class="cart-close" id="admin-modal-close">&times;</span>
    <h2 id="admin-modal-title">Работа</h2>
    <form id="admin-form"></form>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:3000/api';
function getToken() { return localStorage.getItem('nvphotos_admin_token'); }

async function safeFetch(url, options) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();
    try { return JSON.parse(text); } catch (e) { throw new Error(`Сервер вернул не JSON: ${text.substring(0, 100)}`); }
  } catch (err) { throw new Error(`Ошибка сети: ${err.message}`); }
}

// ====== СЖАТИЕ ИЗОБРАЖЕНИЙ ======
function compressImage(file, maxWidth = 1400, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob((blob) => {
          const newFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), {
            type: 'image/jpeg',
            lastModified: Date.now()
          });
          resolve(newFile);
        }, 'image/jpeg', quality);
      };
      img.onerror = (e) => reject(e);
    };
    reader.onerror = (e) => reject(e);
  });
}

// ====== ОТРИСОВКА ИНТЕРФЕЙСА ======
function renderPage() {
  const login = localStorage.getItem('nvphotos_admin_login') || 'admin';
  
  document.getElementById('header-slot').innerHTML = `
    <header>
      <div class="container header-inner">
        <a href="../index.html" class="logo">
          <img class="logo-icon" src="../img/logo.jpg" alt="NVPhotos">
          NVPhotos
        </a>
        <div class="header-actions">
          <span style="color:#888;">${login}</span>
          <a href="#" id="logout-btn">Выйти</a>
        </div>
      </div>
    </header>
  `;

  document.getElementById('layout-slot').innerHTML = `
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <ul>
          <li><a href="services.html">Услуги</a></li>
          <li><a href="orders.html">Заказы</a></li>
          <li><a href="promocodes.html">Промокоды</a></li>
          <li><a href="reviews.html">Отзывы</a></li>
          <li><a href="portfolio.html" class="active">Портфолио</a></li>
          <li><a href="achievements.html">Достижения</a></li>
          <li><a href="contacts.html">Сообщения</a></li>
        </ul>
      </aside>
      <main class="admin-main">
        <div class="admin-header-row">
          <h1 class="admin-page-title">Портфолио</h1>
          <button class="btn-primary" id="btn-add">+ Добавить работу</button>
        </div>
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Превью</th><th>Название</th><th>Категория</th><th>Порядок</th><th>Действия</th></tr>
          </thead>
          <tbody id="portfolio-tbody"></tbody>
        </table>
      </main>
    </div>
  `;

  document.getElementById('logout-btn').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('nvphotos_admin_token');
    localStorage.removeItem('nvphotos_admin_login');
    window.location.href = '../login.html';
  });

  document.getElementById('btn-add').addEventListener('click', () => openForm(null));
  document.getElementById('admin-modal-close').addEventListener('click', closeModal);
  document.getElementById('admin-modal').addEventListener('click', (e) => {
    if (e.target.id === 'admin-modal') closeModal();
  });
}

// ====== ЗАГРУЗКА ДАННЫХ ======
async function loadData() {
  const tbody = document.getElementById('portfolio-tbody');
  if (!tbody) return;

  try {
    const [items, categories] = await Promise.all([
      safeFetch(`${API_BASE}/admin/portfolio`, { headers: { 'Authorization': 'Bearer ' + getToken() } }),
      safeFetch(`${API_BASE}/categories`)
    ]);

    if (!items || items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">Работ пока нет</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(p => {
      const src = p.ImageUrl && p.ImageUrl.startsWith('/img/') 
        ? 'http://localhost:3000' + p.ImageUrl 
        : (p.ImageUrl || '');
      const catName = categories.find(c => c.Id === p.CategoryId)?.Name || '—';
      
      return `
        <tr>
          <td>${p.Id}</td>
          <td>${src ? `<img src="${src}" style="height:50px;border-radius:5px;object-fit:cover;">` : '—'}</td>
          <td>${p.Title || '—'}</td>
          <td>${catName}</td>
          <td>${p.SortOrder}</td>
          <td>
            <button class="btn-small btn-edit" onclick="editItem(${p.Id})">Изменить</button>
            <button class="btn-small btn-delete" onclick="deleteItem(${p.Id})">Удалить</button>
          </td>
        </tr>
      `;
    }).join('');
  } catch (err) {
    console.error('Ошибка загрузки данных:', err);
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Ошибка: ${err.message}</td></tr>`;
  }
}

// ====== ФОРМА ======
async function openForm(id = null) {
  const isEdit = !!id;
  let item = {};
  
  try {
    if (isEdit) {
      const all = await safeFetch(`${API_BASE}/admin/portfolio`, { headers: { 'Authorization': 'Bearer ' + getToken() } });
      item = all.find(x => x.Id === id) || {};
    }

    const categories = await safeFetch(`${API_BASE}/categories`);
    const catOptions = categories.map(c => 
      `<option value="${c.Id}" ${item.CategoryId === c.Id ? 'selected' : ''}>${c.Name}</option>`
    ).join('');

    const existingSrc = item.ImageUrl && item.ImageUrl.startsWith('/img/') 
      ? 'http://localhost:3000' + item.ImageUrl 
      : (item.ImageUrl || '');

    const html = `
      <label class="form-field"><span>Название</span><input type="text" id="f-title" value="${item.Title || ''}"></label>
      <label class="form-field">
        <span>Загрузить картинки (можно несколько)</span>
        <input type="file" id="f-file" accept="image/*" multiple>
      </label>
      <label class="form-field"><span>Или путь вручную</span><input type="text" id="f-image" value="${item.ImageUrl || ''}"></label>
      <img class="img-preview ${existingSrc ? 'show' : ''}" id="f-preview" src="${existingSrc}" alt="">
      <label class="form-field"><span>Категория</span><select id="f-cat"><option value="">— Нет —</option>${catOptions}</select></label>
      <label class="form-field"><span>Порядок</span><input type="number" id="f-sort" value="${item.SortOrder || 0}"></label>
    `;

    document.getElementById('admin-modal-title').textContent = isEdit ? 'Изменить работу' : 'Добавить работу';
    const form = document.getElementById('admin-form');
    form.innerHTML = html + `<button type="submit" class="checkout-btn">Сохранить</button>`;
    document.getElementById('admin-modal').classList.add('open');

    // Превью
    setTimeout(() => {
      const fileInput = document.getElementById('f-file');
      if (fileInput) {
        fileInput.addEventListener('change', () => {
          if (fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = (e) => { 
              document.getElementById('f-preview').src = e.target.result; 
              document.getElementById('f-preview').classList.add('show'); 
            };
            reader.readAsDataURL(fileInput.files[0]);
          }
        });
      }
    }, 0);

    // Обработка отправки
    form.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Сжатие и сохранение...';

      const timeoutId = setTimeout(() => {
        if (submitBtn.disabled) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Сохранить';
          alert('Сервер долго не отвечает.');
        }
      }, 60000); // Увеличили таймаут, так как сжатие нескольких фото может занять время

      try {
        let imageUrl = document.getElementById('f-image').value.trim();
        const files = document.getElementById('f-file').files;
        const catId = Number(document.getElementById('f-cat').value) || null;
        const sortOrder = Number(document.getElementById('f-sort').value) || 0;
        const title = document.getElementById('f-title').value.trim();

        if (files.length > 0) {
          const fd = new FormData();
          
          // Сжимаем каждый файл перед отправкой
          for (let i = 0; i < files.length; i++) {
            const compressedFile = await compressImage(files[i]);
            fd.append('files', compressedFile);
          }

          const uploadRes = await safeFetch(`${API_BASE}/admin/upload`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + getToken() },
            body: fd
          });

          if (!uploadRes.success) { 
            throw new Error(uploadRes.error || 'Ошибка загрузки файлов'); 
          }

          if (files.length > 1 && !isEdit) {
            for (let i = 0; i < uploadRes.urls.length; i++) {
              await safeFetch(`${API_BASE}/admin/portfolio`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                body: JSON.stringify({
                  Title: title ? `${title} ${i + 1}` : '',
                  ImageUrl: uploadRes.urls[i],
                  CategoryId: catId,
                  SortOrder: sortOrder + i
                })
              });
            }
            clearTimeout(timeoutId);
            closeModal();
            loadData();
            return;
          } else {
            imageUrl = uploadRes.urls[0];
          }
        }

        if (!imageUrl && !isEdit) {
          throw new Error('Выберите файлы или укажите путь');
        }

        const data = {
          Title: title,
          ImageUrl: imageUrl || item.ImageUrl,
          CategoryId: catId,
          SortOrder: sortOrder
        };

        const method = isEdit ? 'PUT' : 'POST';
        const url = isEdit ? `${API_BASE}/admin/portfolio/${id}` : `${API_BASE}/admin/portfolio`;

        const result = await safeFetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
          body: JSON.stringify(data)
        });

        if (result.success) { 
          clearTimeout(timeoutId);
          closeModal(); 
          loadData(); 
        } else { 
          throw new Error(result.error || 'Ошибка сохранения'); 
        }
      } catch (err) {
        clearTimeout(timeoutId);
        console.error('Ошибка:', err);
        alert('Ошибка: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Сохранить';
      }
    };
  } catch (err) {
    console.error('Ошибка формы:', err);
    alert('Не удалось открыть форму: ' + err.message);
  }
}

function closeModal() {
  document.getElementById('admin-modal').classList.remove('open');
}

window.editItem = (id) => openForm(id);
window.deleteItem = async (id) => {
  if (!confirm('Удалить работу?')) return;
  try {
    await safeFetch(`${API_BASE}/admin/portfolio/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    loadData();
  } catch (err) {
    alert('Ошибка удаления: ' + err.message);
  }
};

document.addEventListener('DOMContentLoaded', async () => {
  if (!getToken()) {
    window.location.href = '../login.html';
    return;
  }
  renderPage();
  await loadData();
});
</script>
</body>
</html>
