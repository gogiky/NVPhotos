<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Услуги — NVPhotos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <img class="logo-icon" src="img/logo.jpg" alt="NVPhotos">
      NVPhotos
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="services.html" class="active">Услуги</a></li>
        <li><a href="achievements.html">Достижения</a></li>
        <li><a href="portfolio.html">Портфолио</a></li>
        <li><a href="reviews.html">Отзывы</a></li>
        <li><a href="contacts.html">Контакты</a></li>
        <li><a href="#" id="cart-link">Корзина <span id="cart-count">0</span></a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="services-header">
  <div class="container">
    <h1 class="services-page-title">Услуги</h1>
  </div>
</section>

<section class="popular-services">
  <div class="container">
    <div class="slider-outer">
      <button class="slider-arrow slider-prev" id="slider-prev">‹</button>
      <div class="slider-wrapper">
        <div class="slider-track" id="popular-track"></div>
      </div>
      <button class="slider-arrow slider-next" id="slider-next">›</button>
    </div>
  </div>
</section>

<section class="all-services">
  <div class="container">
    <div class="search-box">
      <input type="text" id="service-search" placeholder="Поиск услуги...">
    </div>

    <div class="all-services-grid" id="all-services-grid"></div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-top">
      <div class="footer-logo">
        <img class="logo-icon" src="img/logo.jpg" alt="NVPhotos">
        NVPhotos
      </div>
      <nav class="footer-nav">
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="services.html">Услуги</a></li>
          <li><a href="achievements.html">Достижения</a></li>
          <li><a href="portfolio.html">Портфолио</a></li>
          <li><a href="reviews.html">Отзывы</a></li>
          <li><a href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>

    <div class="footer-bottom">
      <div class="socials">
        <a href="https://vk.ru/copilka_vospominanii" title="VK">VK</a>
        <a href="https://t.me/bank_of_memorie" title="Telegram">TG</a>
        <a href="https://ru.pinterest.com/BankofMemoriesOff/" title="Pinterest">PIN</a>
      </div>
      <div class="copyright">Все права защищены © 2026</div>
    </div>
  </div>
</footer>

<div class="cart-modal" id="cart-modal">
  <div class="cart-modal-content">
    <span class="cart-close" id="cart-close">&times;</span>
    <h2>Корзина</h2>
    <div id="cart-items"></div>
    <div class="cart-row"><span>Подытог:</span><span id="cart-subtotal">0 ₽</span></div>
    <div class="cart-row cart-row-discount" style="display:none;"><span>Скидка:</span><span id="cart-discount">0%</span></div>
    <div class="cart-row cart-row-total"><span>Итого:</span><span id="cart-total">0 ₽</span></div>
    <div class="cart-promo">
      <input type="text" id="promo-input" placeholder="Промокод">
      <button id="promo-apply" type="button">Применить</button>
    </div>
    <div id="promo-message"></div>
    <button class="checkout-btn" id="checkout-btn" type="button">Оформить заказ</button>
  </div>
</div>

<div class="cart-modal" id="checkout-modal">
  <div class="cart-modal-content">
    <span class="cart-close" id="checkout-close">&times;</span>
    <h2>Оформление заказа</h2>
    <form id="checkout-form">
      <label class="form-field"><span>Имя</span><input type="text" id="checkout-name" placeholder="Ваше имя" required></label>
      <label class="form-field"><span>Телефон</span><input type="tel" id="checkout-phone" placeholder="+7 (___) ___-__-__" required></label>
      <label class="form-field"><span>Желаемое время съёмки</span><input type="text" id="checkout-time" placeholder="Например: 15.05.2025, 14:00" required></label>
      <label class="form-field"><span>Комментарий (необязательно)</span><textarea id="checkout-comment" rows="3"></textarea></label>
      <div id="checkout-error" class="form-error"></div>
      <div id="checkout-success" class="form-success" style="display:none;"></div>
      <button type="submit" class="checkout-btn">Подтвердить заказ</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script src="js/services.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Cart.init();
  });
</script>
</body>
</html>
